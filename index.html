<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lost &amp; Log — Campus Claim Office</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="boot">
    <div class="spinner-lg"></div>
    <p>Opening the claim office…</p>
  </div>

  <div id="app" style="display:none;">
    <header class="topbar">
      <div class="sign">
        <h1>LOST &amp; LOG</h1>
        <div class="sub">CAMPUS CLAIM OFFICE</div>
      </div>
    </header>

    <nav class="navicons">
      <div class="navbtn" data-view="home" title="The Board">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="1"/><path d="M7 8h4M7 12h10M7 16h6"/></svg>
        THE BOARD
      </div>
      <div class="navbtn" data-view="myreports" title="My Claims">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3h9l5 5v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z"/><path d="M15 3v5h5"/></svg>
        MY CLAIMS
      </div>
      <div class="navbtn" data-view="notifications" title="Alerts">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3a5 5 0 0 0-5 5v3.6c0 .5-.2 1-.6 1.4L5 14.5c-.6.6-.2 1.5.6 1.5h13c.8 0 1.2-.9.6-1.5l-1.4-1.5a2 2 0 0 1-.6-1.4V8a5 5 0 0 0-5-5Z"/></svg>
        ALERTS
        <span class="badge" id="notifBadge" style="display:none;">0</span>
      </div>
    </nav>

    <main id="main"></main>
  </div>

  <!-- NAME PROMPT MODAL -->
  <div class="overlay" id="nameOverlay">
    <div class="modal">
      <div class="modal-header"><span class="modal-title">WELCOME — STATE YOUR NAME FOR THE RECORD</span></div>
      <div class="field">
        <label>Name</label>
        <input type="text" id="nameInput" placeholder="e.g. Aryan Bhargune">
      </div>
      <button class="btn btn-primary" id="nameSubmitBtn">Enter the Office</button>
    </div>
  </div>

  <!-- REPORT LOST MODAL -->
  <div class="overlay" id="lostOverlay">
    <div class="modal">
      <div class="modal-header">
        <span class="back" data-close>&#8592;</span>
        <span class="modal-title">FILE A LOST-ITEM TICKET</span>
      </div>
      <div class="field" id="lostCatField">
        <label>Item Category</label>
        <select id="lostCategory">
          <option value="">Select category</option>
          <option>ID Card</option>
          <option>Wallet</option>
          <option>Electronics</option>
          <option>Water Bottle</option>
          <option>Umbrella</option>
          <option>Charger / Cable</option>
          <option>Keys</option>
          <option>Bag</option>
          <option>Other</option>
        </select>
        <div class="field-err">Please select a category</div>
      </div>
      <div class="field" id="lostDescField">
        <label>Description of Item</label>
        <textarea id="lostDesc" placeholder="e.g. Blue umbrella, left near Admin Office"></textarea>
        <div class="field-err">Description can't be empty</div>
      </div>
      <button class="btn btn-primary" id="lostSubmitBtn">Stamp &amp; File Ticket</button>
    </div>
  </div>

  <!-- REPORT FOUND MODAL -->
  <div class="overlay" id="foundOverlay">
    <div class="modal">
      <div class="modal-header">
        <span class="back" data-close>&#8592;</span>
        <span class="modal-title">LOG A FOUND ITEM</span>
      </div>
      <label class="stamp-font" style="font-size:10.5px; color:var(--ink-dim); display:block; margin-bottom:8px;">You are claiming to have found —</label>
      <div class="preview-card" id="foundPreview"></div>
      <div class="field" id="foundLocField">
        <label>Drop-off Location</label>
        <select id="foundLoc">
          <option value="">Select drop-off point</option>
          <option>Admin Office</option>
          <option>Library Desk</option>
          <option>Security Cabin</option>
          <option>Hostel Warden</option>
          <option>Canteen Counter</option>
          <option>Other</option>
        </select>
        <div class="field-err">Please select a drop-off location</div>
      </div>
      <button class="btn btn-primary" id="foundSubmitBtn">Confirm &amp; Stamp Found</button>
    </div>
  </div>

  <div id="toast"><span id="toastMsg"></span></div>

  <script type="module" src="script.js"></script>
</body>
</html>
